server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: never

spring:
  application:
    name: vetandes-backend
  datasource:
    url: ${ORACLE_URL:jdbc:oracle:thin:@//localhost:1522/FREEPDB1}
    username: ${ORACLE_USER:VETANDES}
    password: ${ORACLE_PASSWORD:VetAndes2026*}
    driver-class-name: oracle.jdbc.OracleDriver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-on-migrate: true
  jackson:
    default-property-inclusion: non_null

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
  api-docs:
    path: /v3/api-docs

app:
  jwt:
    # Clave local de desarrollo (32 bytes Base64). En otro entorno definir JWT_SECRET.
    secret: ${JWT_SECRET:dmV0YW5kZXMtbG9jYWwtand0LWtleS0yMDI2LXNlY3VyZS0zMg==}
    expiration-seconds: ${JWT_EXPIRATION_SECONDS:3600}
  cors:
    allowed-origin: ${CORS_ALLOWED_ORIGIN:http://localhost:4200}

logging:
  level:
    pe.edu.upeu.vetandes: INFO
    org.springframework.security: WARN
    org.hibernate.SQL: WARN
